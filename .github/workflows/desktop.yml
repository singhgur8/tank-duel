name: Desktop app

# Builds the Mac and Windows apps and publishes them on a GitHub Release named after the version in
# package.json (v0.1.0, ...). Bump "version" to start a new release; pushes with the same version refresh its files.
on:
  push:
    branches: [main, game-v1]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build universal app (Apple Silicon + Intel)
        run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Ad-hoc sign and make the .dmg
        run: |
          APP="$(ls -d release/mac-universal/*.app)"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          VERSION=$(node -p "require('./package.json').version")
          hdiutil create -volname "Tank Duel" -srcfolder dmg -ov -format UDZO "release/Tank-Duel-${VERSION}-mac.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: release/*.dmg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: release/*.exe }

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Tank Duel ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            **Mac:** download the `.dmg`, open it and drag Tank Duel into Applications. The first time, right-click the app and choose **Open** (or allow it under System Settings → Privacy & Security → **Open Anyway**), because the app isn't signed with an Apple developer certificate.
            **Windows:** run `Tank-Duel-Setup` to install, or use the `Portable` .exe without installing. If SmartScreen appears, click **More info → Run anyway**.
